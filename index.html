<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAM Fleets - Fleet &amp; Trip Management</title>
    <meta name="description" content="KAM Fleets operations system for managing trucks, drivers, trips, expenses, and spare parts." />
    <meta property="og:title" content="KAM Fleets - Fleet &amp; Trip Management" />
    <meta property="og:description" content="KAM Fleets operations system for managing trucks, drivers, trips, expenses, and spare parts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon-192.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        const appBaseUrl = new URL(import.meta.env.BASE_URL, window.location.origin);
        const serviceWorkerUrl = new URL('sw.js', appBaseUrl);

        if (import.meta.env.DEV) {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(
              registrations
                .filter((registration) => [registration.active, registration.installing, registration.waiting]
                  .some((worker) => worker?.scriptURL === serviceWorkerUrl.href))
                .map((registration) => registration.unregister())
            ))
            .then(() => caches.keys())
            .then((cacheNames) => Promise.all(
              cacheNames
                .filter((cacheName) => cacheName.startsWith('jcq-fleet-'))
                .map((cacheName) => caches.delete(cacheName))
            ))
            .catch((error) => console.warn('Failed to remove the development service worker:', error));
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register(serviceWorkerUrl, { scope: appBaseUrl.pathname })
              .then((registration) => {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
              })
              .catch((error) => {
                console.warn('ServiceWorker registration failed: ', error);
              });
          });
        }
      }
    </script>
  </body>
</html>
